<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morbidium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --ink:#2a1a14; --parch:#ecd9a8; --parch-d:#c9a86a; --parch-l:#f6ead0; --gold:#e8b93a; --gold-d:#9a6a18;
  --red:#b3261e; --heart:#d8322a; --mint:#7fb89a; --mint-d:#3f6e5a; --morb:#7b3aa6; --bg:#140e0b;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif; --body:"Alegreya", Georgia, serif; --hand:"Caveat", "Comic Sans MS", cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#140e0b; } }
:root[data-theme="dark"]{ --bg:#140e0b; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--bg); overflow:hidden; font-family:var(--body); color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:none; }
*{ box-sizing:border-box; }
#game{ position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
#vignette{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 65% at 50% 52%, transparent 55%, rgba(20,12,8,.55) 100%); }
#hurt{ position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .2s; background:radial-gradient(ellipse at center, transparent 50%, rgba(190,30,20,.5) 100%); }
#fx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.hidden{ display:none !important; }

/* skadetall og snakkebobler */
.dmg{ position:absolute; transform:translate(-50%,-50%); font-family:var(--display); font-size:26px; color:#fff6d8; white-space:nowrap;
  -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink); }
.dmg.crit{ color:var(--gold); font-size:34px; }
.dmg.hurt{ color:#ff6a5a; }
.mester.npc{ color:#f6ead0; font-family:var(--body); font-weight:800; font-size:13px; -webkit-text-stroke:1.2px var(--ink); }
.mester{ position:absolute; transform:translate(-50%,-100%); font-family:var(--display); font-size:13px; color:#f2c230; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; white-space:nowrap; pointer-events:none; }
.dmg.stamp{ font-family:var(--display); color:var(--red); font-size:30px; -webkit-text-stroke:2px #f6ead0; text-shadow:none; }
.dmg.info{ font-family:var(--body); font-weight:800; font-size:17px; color:var(--parch-l); -webkit-text-stroke:1.5px var(--ink); }
.bubble{ position:absolute; transform:translate(-50%,-100%); background:var(--parch-l); border:3px solid var(--ink); border-radius:14px 14px 14px 4px;
  padding:5px 11px 6px; font-family:var(--hand); font-size:21px; line-height:1.05; max-width:230px; text-align:center; box-shadow:4px 4px 0 rgba(42,26,20,.55); }
.bubble::after{ content:""; position:absolute; left:18px; bottom:-13px; border:7px solid transparent; border-top-color:var(--ink); border-left-color:var(--ink); }

/* HUD: pasientmerke oppe til venstre */
#hud{ position:fixed; inset:0; pointer-events:none; }
#badge{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); top:calc(10px + env(safe-area-inset-top,0px)); display:flex; align-items:flex-start; }
#medal{ position:relative; width:86px; height:86px; border-radius:50%; background:#7d9aa6; border:6px solid var(--gold);
  box-shadow:0 0 0 3px var(--ink), inset 0 0 0 3px var(--ink), 4px 5px 0 3px rgba(20,12,8,.5); overflow:hidden; z-index:2; }
#medal canvas{ width:100%; height:100%; display:block; }
#plate{ margin:8px 0 0 -14px; padding:6px 14px 8px 22px; background:var(--parch); border:3px solid var(--ink); border-radius:0 10px 10px 0; box-shadow:4px 4px 0 rgba(20,12,8,.5); min-width:230px; }
#plate .nm{ font-family:var(--display); font-size:16px; line-height:1; }
#plate .nm small{ font-family:var(--hand); font-size:18px; margin-left:6px; color:#6b4a2c; }
#hearts{ display:flex; gap:3px; margin-top:6px; }
#hearts svg{ width:24px; height:22px; }
#row2{ display:flex; align-items:center; gap:10px; margin-top:6px; font-family:var(--display); font-size:15px; }
.vial{ position:relative; width:96px; height:13px; border:3px solid var(--ink); border-radius:8px; background:#3d2a44; overflow:hidden; }
.vial i{ position:absolute; left:0; top:0; bottom:0; width:22%; background:linear-gradient(180deg,#b36be0,var(--morb)); }
.teeth{ display:flex; align-items:center; gap:4px; }
.teeth svg{ width:16px; height:18px; }

/* romskilt */
#roomsign{ position:absolute; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); }
.ribbon{ position:relative; background:var(--mint); color:var(--ink); border:3px solid var(--ink); padding:4px 22px 5px; font-family:var(--display); font-size:17px; box-shadow:4px 4px 0 rgba(20,12,8,.45); white-space:nowrap; }
.ribbon::before,.ribbon::after{ content:""; position:absolute; top:6px; width:16px; height:100%; background:var(--mint-d); border:3px solid var(--ink); z-index:-1; }
.ribbon::before{ left:-14px; border-right:none; } .ribbon::after{ right:-14px; border-left:none; }

/* evnekort */
#cards{ position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; gap:12px; align-items:flex-end; }
.acard{ position:relative; width:72px; height:92px; background:var(--parch-l); border:3px solid var(--ink); border-radius:5px; box-shadow:4px 4px 0 rgba(20,12,8,.5);
  background-image:repeating-linear-gradient(180deg, transparent 0 15px, rgba(80,120,170,.22) 15px 16px); }
.acard:nth-child(odd){ transform:rotate(-2deg); } .acard:nth-child(even){ transform:rotate(1.6deg) translateY(-3px); }
.acard::before{ content:""; position:absolute; left:50%; top:-8px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ffe28a, var(--gold) 55%, var(--gold-d)); border:2px solid var(--ink); }
.acard svg{ position:absolute; left:50%; top:12px; width:44px; height:44px; transform:translateX(-50%); }
.acard .nm{ position:absolute; left:3px; right:3px; bottom:5px; text-align:center; font-weight:800; font-size:11px; line-height:1.05; }
.acard .k{ position:absolute; right:-7px; bottom:-7px; width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--parch-l); font-family:var(--display); font-size:13px; line-height:22px; text-align:center; border:2px solid var(--gold); }
.acard .cd{ position:absolute; inset:0; background:rgba(42,26,20,.62); color:var(--parch-l); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:22px; border-radius:2px; }

/* våpenkort */
#weapon{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:170px; background:var(--parch); border:3px solid var(--ink); border-radius:6px; box-shadow:4px 4px 0 rgba(20,12,8,.5); padding:6px 10px 8px; display:flex; gap:8px; align-items:center; transform:rotate(-1deg); }
#weapon canvas{ width:44px; height:66px; }
#weapon b{ font-family:var(--display); font-weight:normal; font-size:13px; display:block; overflow-wrap:anywhere; line-height:1.1; }
#weapon i{ font-family:var(--hand); font-style:normal; font-size:17px; line-height:1; color:#5a3a22; }

/* kart i gullring */
#mapring{ position:absolute; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:150px; height:150px; border-radius:50%;
  background:#1c1410; border:8px solid var(--gold); box-shadow:0 0 0 3px var(--ink), inset 0 0 0 3px var(--ink), inset 0 0 0 7px var(--gold-d), 4px 5px 0 3px rgba(20,12,8,.5); overflow:hidden; }
#mapring canvas{ width:100%; height:100%; display:block; }
#mapring::after{ content:""; position:absolute; inset:-2px; border-radius:50%; background:
  radial-gradient(circle at 50% 0%, var(--gold) 0 7px, var(--ink) 7px 9px, transparent 9px),
  radial-gradient(circle at 100% 50%, var(--gold) 0 7px, var(--ink) 7px 9px, transparent 9px),
  radial-gradient(circle at 50% 100%, var(--gold) 0 7px, var(--ink) 7px 9px, transparent 9px),
  radial-gradient(circle at 0% 50%, var(--gold) 0 7px, var(--ink) 7px 9px, transparent 9px); }

/* verktøylinje for testen */
#tools{ position:absolute; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(12px + env(safe-area-inset-top,0px)); display:flex; gap:8px; pointer-events:auto; }
.btn{ font-family:var(--display); font-size:14px; background:var(--parch); color:var(--ink); border:3px solid var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; box-shadow:3px 3px 0 rgba(20,12,8,.5); }
.btn:hover{ background:var(--parch-l); } .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.btn.big{ font-size:19px; padding:9px 22px; background:var(--gold); }
#help{ position:absolute; left:50%; bottom:calc(122px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); font-weight:700; font-size:14px; color:var(--parch-l); background:rgba(20,12,8,.62); border:2px solid rgba(236,217,168,.35); border-radius:6px; padding:5px 12px; white-space:nowrap; }
#help kbd{ font-family:var(--display); font-size:12px; color:var(--gold); }

/* dødskort */
#death{ position:fixed; inset:0; background:rgba(14,9,7,.78); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; pointer-events:auto; }
#death h1{ margin:0 0 14px; font-family:var(--display); font-weight:normal; font-size:clamp(44px,9vw,76px); color:#f2c230; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:5px 6px 0 var(--ink); transform:rotate(-2deg); }
.dcard{ position:relative; width:min(340px,92vw); background:var(--parch); border:4px solid var(--ink); border-radius:8px; box-shadow:8px 8px 0 rgba(0,0,0,.55); padding:0 22px 18px; text-align:center; }
.dcard .slab{ margin:0 -22px 12px; height:132px; background:linear-gradient(#8a8f96,#6d7278); border-bottom:4px solid var(--ink); border-radius:4px 4px 0 0; position:relative; overflow:hidden; }
.dcard .slab canvas{ position:absolute; left:50%; top:4px; transform:translateX(-50%); }
.dcard .slab .plate{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%); background:#5a5f66; color:var(--parch-l); border:3px solid var(--ink); padding:2px 16px; font-family:var(--display); font-size:16px; white-space:nowrap; }
.dcard .alive{ font-weight:800; font-size:14px; margin-bottom:6px; }
.dcard dl{ margin:0; } .dcard dt{ font-weight:700; font-size:16px; color:#6b4a2c; margin-top:8px; } .dcard dd{ margin:0; font-family:var(--display); font-size:26px; color:#b07a10; -webkit-text-stroke:1px var(--ink); }
.dcard .cause{ font-family:var(--body); font-weight:800; font-size:19px; color:var(--ink); -webkit-text-stroke:0; line-height:1.2; max-width:26ch; margin:0 auto; }
.dcard .stamp{ position:absolute; right:-16px; top:84px; font-family:var(--display); color:var(--red); border:5px double var(--red); padding:2px 10px; font-size:24px; transform:rotate(14deg); background:rgba(236,217,168,.6); }
#death .btn{ margin-top:18px; }

#toast{ position:fixed; left:50%; top:26%; transform:translate(-50%,-50%) rotate(-4deg); pointer-events:none; font-family:var(--display); font-size:46px; color:#f2c230; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:4px 5px 0 var(--ink); opacity:0; transition:opacity .25s; white-space:nowrap; }
#toast.on{ opacity:1; }

#touch{ position:fixed; inset:0; pointer-events:none; z-index:5; }
#stick{ position:absolute; left:calc(18px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:124px; height:124px; border-radius:50%; border:3px solid rgba(236,217,168,.55); background:rgba(20,12,8,.18); pointer-events:auto; }
#stick i{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(236,217,168,.6); border:3px solid var(--ink); }
/* handlingsknappene i en klynge rundt det store slagknappen, nede til høyre */
#tbtns{ position:absolute; right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:200px; height:190px; pointer-events:none; }
#tbtns button{ position:absolute; width:54px; height:54px; border-radius:50%; border:3px solid var(--ink); background:rgba(236,217,168,.88); font-family:var(--display); font-size:12px; color:var(--ink); pointer-events:auto; box-shadow:2px 3px 0 rgba(20,12,8,.45); padding:0; }
#tbtns button:active{ transform:scale(.92); background:var(--gold); }
#tbtns [data-t=attack]{ right:4px; bottom:6px; width:80px; height:80px; font-size:15px; background:rgba(232,185,58,.92); }
#tbtns [data-t=heavy]{ right:92px; bottom:0; }
#tbtns [data-t=dodge]{ right:12px; bottom:96px; }
#tbtns [data-t=interact]{ right:78px; bottom:70px; width:48px; height:48px; font-size:11px; }
#tbtns [data-t=use]{ right:146px; bottom:40px; width:44px; height:44px; font-size:11px; }
#tbtns [data-t=active]{ right:58px; bottom:128px; width:46px; height:46px; font-size:11px; }
body.touch #weapon, body.touch #cons, body.touch #help{ display:none; }
body.touch #cards{ pointer-events:auto; bottom:calc(20px + env(safe-area-inset-bottom,0px)); gap:8px; }
body.touch #cards .acard{ pointer-events:auto; }
body.touch #mapring{ top:calc(60px + env(safe-area-inset-top,0px)); bottom:auto; width:104px; height:104px; border-width:6px; }
body.touch #tools{ top:calc(172px + env(safe-area-inset-top,0px)); bottom:auto; left:auto; right:calc(12px + env(safe-area-inset-right,0px)); flex-direction:column; }
body.touch #prompt{ bottom:calc(214px + env(safe-area-inset-bottom,0px)); }
@media (orientation:portrait){
  body.touch #cards{ bottom:calc(214px + env(safe-area-inset-bottom,0px)); }
  body.touch #cards .acard{ width:54px; height:70px; } body.touch #cards .acard .nm{ font-size:8.5px; }
  body.touch #mapring{ top:calc(126px + env(safe-area-inset-top,0px)); width:92px; height:92px; }
  body.touch #tools{ top:calc(228px + env(safe-area-inset-top,0px)); }
  body.touch #prompt{ bottom:calc(300px + env(safe-area-inset-bottom,0px)); }
}

/* ---------- felles: papir med ujevn kant (SVG-filter) ---------- */
.paper{ position:relative; }
.paper::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--parch); border:3px solid var(--ink); border-radius:6px; filter:url(#rough); box-shadow:6px 7px 0 rgba(0,0,0,.45); }
#grain{ position:fixed; inset:0; pointer-events:none; }
#prompt{ position:absolute; left:50%; bottom:calc(126px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); font-weight:800; font-size:17px; color:var(--parch-l); background:rgba(20,12,8,.72); border:2px solid var(--gold); border-radius:20px; padding:4px 14px; white-space:nowrap; }
#prompt kbd{ font-family:var(--display); color:var(--gold); margin-right:6px; }
#pa{ position:absolute; left:50%; top:calc(58px + env(safe-area-inset-top,0px)); transform:translateX(-50%); max-width:min(640px,86vw); text-align:center; font-family:var(--hand); font-size:21px; color:var(--parch-l); background:rgba(20,12,8,.6); border-radius:8px; padding:4px 14px; opacity:0; transition:opacity .4s; }
#pa.on{ opacity:1; }
#bossBar{ position:absolute; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%); width:min(520px,80vw); text-align:center; }
#bossName{ font-family:var(--display); font-size:22px; color:#f2c230; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink); }
#bossTitle{ font-family:var(--hand); font-size:18px; color:var(--parch-l); margin-top:-2px; }
.bbar{ height:18px; border:3px solid var(--ink); border-radius:10px; background:#3a1a1a; overflow:hidden; box-shadow:3px 3px 0 rgba(0,0,0,.5); margin-top:3px; }
#bossFill{ height:100%; width:100%; background:linear-gradient(180deg,#e84a3a,#9a1a14); transition:width .15s; }
#items{ display:flex; flex-wrap:wrap; gap:2px; margin-top:5px; max-width:250px; } #items canvas{ width:24px; height:24px; }
.kurlist{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:8px; } .kur{ display:flex; gap:6px; align-items:center; border:2px solid rgba(42,26,20,.4); border-radius:4px; padding:3px 6px; font-size:12px; line-height:1.15; } .kur canvas{ width:44px; height:44px; flex:none; }
#xpbar{ height:6px; background:#4a3a2a; border-radius:3px; margin-top:5px; overflow:hidden; } #xpbar i{ display:block; height:100%; width:0; background:var(--gold); }
#lvl{ font-family:var(--display); font-size:13px; }
#pips{ display:flex; gap:4px; } #pips i{ width:12px; height:12px; border-radius:50%; border:2px solid var(--ink); background:var(--gold); } #pips i.off{ background:#5a4a3a; }
#cons{ position:absolute; left:calc(196px + env(safe-area-inset-left,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:64px; height:80px; transform:rotate(2deg); text-align:center; font-weight:800; font-size:11px; padding-top:4px; }
#cons canvas{ width:40px; height:52px; display:block; margin:0 auto; }
#akt{ position:absolute; left:calc(272px + env(safe-area-inset-left,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:64px; height:80px; transform:rotate(-2deg); text-align:center; padding-top:6px; }
#akt canvas{ width:46px; height:46px; display:block; margin:0 auto; } #akt .n{ position:absolute; right:-6px; top:-8px; font-family:var(--display); font-size:13px; background:var(--ink); color:var(--gold); border-radius:10px; padding:0 6px; }
#akt .pips{ display:flex; gap:3px; justify-content:center; margin-top:4px; } #akt .pips i, #tAkt i{ width:8px; height:8px; border-radius:2px; border:2px solid var(--ink); background:var(--gold); } #akt .pips i.off, #tAkt i.off{ background:#5a4a3a; }
#akt.full{ box-shadow:0 0 0 3px var(--gold); }
#tAkt{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; } #tAkt canvas{ width:26px; height:26px; } #tAkt .pp{ display:flex; gap:2px; } #tAkt i{ width:5px; height:5px; border-width:1px; }
#items canvas.lomme{ border:2px solid var(--gold); border-radius:50%; background:rgba(42,26,20,.12); }
body.touch #akt{ display:none; } #cons .n{ position:absolute; right:-6px; top:-8px; font-family:var(--display); font-size:13px; background:var(--ink); color:var(--gold); border-radius:10px; padding:0 6px; }
.acard.match{ box-shadow:0 0 0 3px var(--gold), 4px 4px 0 rgba(20,12,8,.5); }
.acard.tap{ background-color:#fff4c8; filter:brightness(1.1); }
.acard .dots{ position:absolute; left:4px; top:4px; display:flex; gap:2px; } .acard .dots i{ width:6px; height:6px; border-radius:50%; background:var(--ink); } .acard .dots i.off{ background:transparent; border:1px solid var(--ink); }
.acard.empty{ background:rgba(236,217,168,.35); border-style:dashed; }
.acard canvas{ position:absolute; left:50%; top:10px; width:48px; height:48px; transform:translateX(-50%); }
#bigstamp{ position:fixed; left:50%; top:40%; transform:translate(-50%,-50%) rotate(-8deg) scale(1.6); opacity:0; pointer-events:none; text-align:center; font-family:var(--display); color:var(--red); border:7px double var(--red); padding:6px 22px; font-size:48px; background:rgba(236,217,168,.5); transition:transform .18s cubic-bezier(.2,1.6,.4,1), opacity .18s; }
#bigstamp small{ display:block; font-family:var(--hand); font-size:26px; color:var(--ink); margin-top:-4px; }
#bigstamp.on{ opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(1); }
#toast{ top:22%; font-size:40px; text-align:center; }
#toast small{ display:block; font-family:var(--body); font-weight:800; font-size:18px; color:var(--parch-l); -webkit-text-stroke:0; text-shadow:2px 2px 0 var(--ink); }
/* ---------- skjermbilder ---------- */
.screen{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; pointer-events:auto; overflow:auto; }
.screen.dim{ background:rgba(14,9,7,.72); }
#title h1{ margin:0; font-family:var(--display); font-weight:normal; font-size:clamp(52px,11vw,120px); line-height:.95; color:#f2c230; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:6px 8px 0 var(--ink); transform:rotate(-3deg); }
#title .sub{ font-family:var(--hand); font-size:clamp(22px,3vw,30px); color:var(--parch-l); text-shadow:2px 2px 0 var(--ink); margin:6px 0 26px; }
.menu{ display:flex; flex-direction:column; gap:12px; align-items:center; }
.meta{ margin-top:18px; font-weight:700; color:var(--parch-l); text-shadow:1px 1px 0 var(--ink); font-size:15px; text-align:center; max-width:60ch; }
.pickrow{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:stretch; }
.intake{ width:min(300px,90vw); padding:14px 16px 16px; text-align:center; }
.intake h2,.pickcard h3{ margin:0; font-family:var(--display); font-weight:normal; font-size:20px; }

  <div style="font-size:40px;font-weight:bold;color:#f2c230;letter-spacing:.04em">MORBIDIUM</div>
  <div id="bootStep" style="font-size:18px;margin-top:10px">Laster sanatoriet ...</div>
  <div id="bootNote" style="font-size:14px;margin-top:14px;max-width:34ch;opacity:.85"></div>

<script>
(function () {
  var KEY = 'morbidium_boot', prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
  // stoppet forrige oppstart midt i et steg? Da krasjet visningen der. Start i trygg modus.
  window.__recover = prev && prev.step !== 'ok' && Date.now() - prev.t < 30 * 60 * 1000 ? prev.step : null;
  window.bootStep = function (name) {
    try { localStorage.setItem(KEY, JSON.stringify({ step: name, t: Date.now() })); } catch (e) { }
    var el = document.getElementById('bootStep'); if (el) el.textContent = name === 'ok' ? '' : name + ' ...';
  };
  if (window.__recover) document.getElementById('bootNote').textContent = 'Forrige oppstart stoppet under «' + window.__recover + '». Prøver nå trygg modus med enkel grafikk.';
  window.showErr = function (msg) {
    var e = document.getElementById('err'); if (!e || e.dataset.on) return; e.dataset.on = '1'; e.classList.remove('hidden');
    var m = String(msg).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
    var info = (window.__gl || '') + ' | ' + navigator.userAgent.replace(/[<>]/g, '');
    e.innerHTML = '<div class="list paper" style="width:min(520px,92vw);padding:18px 20px;background:#ecd9a8;border:3px solid #2a1a14;border-radius:6px"><div class="jtitle">Noe gikk galt</div><p style="font-size:16px">' + m + '</p><p style="font-size:12px">' + info + '</p><div class="btnrow"><button class="btn big" id="errSimple">Prøv enkel grafikk</button><button class="btn" id="errReload">Last inn på nytt</button></div></div>';
    document.getElementById('errSimple').onclick = function () { try { localStorage.setItem('morbidium_simple', '1'); } catch (x) { } location.reload(); };
    document.getElementById('errReload').onclick = function () { location.reload(); };
  };
  window.addEventListener('error', function (ev) { if (ev && ev.message) showErr(ev.message + (ev.lineno ? ' (linje ' + ev.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (ev) { showErr('Feil: ' + (ev.reason && ev.reason.message || ev.reason)); });
  // skrifter hentes først når siden alt er tegnet
  requestAnimationFrame(function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alegreya:wght@500;700;800&family=Caveat:wght@600&display=swap'; document.head.appendChild(l); });
})();
</script>
