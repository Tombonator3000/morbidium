name: Bygg og publiser på GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - run: python3 tools/skjaer_ark.py
      - run: python3 tools/behandle_bilder.py
      - run: python3 build.py
      # testene må være grønne før siden publiseres, så en ødelagt versjon aldri kommer ut
      - name: Koden (rekkefølgen i build.py, ukjente navn og innpakninger)
        run: node tools/sjekk_kode.js
      - name: Etasjegeneratoren
        run: node tools/test_gen.js > /tmp/test_gen.txt || (tail -5 /tmp/test_gen.txt; exit 1)
      - name: Chromium til røyktesten
        run: python -m playwright install --with-deps chromium
      - name: Røyktest
        run: python3 tools/test_roek.py
      - run: mkdir -p _site && cp dist/morbidium.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
