name: Test
# de samme testene som før publisering, på alle andre grener og i pull requests, så feil synes før noe kommer på main
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - run: python3 tools/skjaer_ark.py
      - run: python3 tools/behandle_bilder.py
      - run: python3 build.py
      - name: Koden (rekkefølgen i build.py, ukjente navn og innpakninger)
        run: node tools/sjekk_kode.js
      - name: Etasjegeneratoren
        run: node tools/test_gen.js > /tmp/test_gen.txt || (tail -5 /tmp/test_gen.txt; exit 1)
      - name: Chromium til røyktesten
        run: python -m playwright install --with-deps chromium
      - name: Røyktest
        run: python3 tools/test_roek.py
      - name: Dokumentene er korte nok (bare varsel)
        run: python3 tools/rydd_dokumenter.py --sjekk || echo "::warning::Kjør python3 tools/rydd_dokumenter.py (log.md, todo.md eller memory.md er for lange)"
